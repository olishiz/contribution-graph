# One roll of 1–5 commits per Kuala Lumpur day.
#
# GitHub Actions schedules are UTC. Asia/Kuala_Lumpur is UTC+8 all year.
#   09:15 KL = 01:15 UTC
#   21:15 KL = 13:15 UTC
# The evening run records the day only when the morning run did not.
# Commit timestamps are noon +0800, so the square stays on that KL date.

name: Daily contribution

on:
  schedule:
    - cron: "15 1 * * *"
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Kuala Lumpur days to fill, counting back from today. A day that already has a commit is skipped. 365 fills the open days in the past year."
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: daily-contribution
  cancel-in-progress: false

jobs:
  contribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Commit open Kuala Lumpur days
        id: commit
        env:
          GIT_EMAIL: zhuen1101@hotmail.com
          GIT_NAME: olishiz
          MAX_DAYS: "${{ github.event_name == 'workflow_dispatch' && inputs.days || '1' }}"
        run: |
          before="$(git rev-parse HEAD)"
          python3 scripts/contribute.py
          after="$(git rev-parse HEAD)"
          if [ "$before" = "$after" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.commit.outputs.pushed == 'true'
        run: git push origin "HEAD:${GITHUB_REF_NAME}"
